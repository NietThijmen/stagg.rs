name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    # Placeholder values so SvelteKit can analyse the server bundle at build
    # time. Real values are only needed at runtime.
    env:
      WORKOS_API_KEY: sk_test_ci_placeholder
      WORKOS_CLIENT_ID: client_test_ci_placeholder
      WORKOS_REDIRECT_URI: http://localhost:3000/auth/callback
      WORKOS_COOKIE_PASSWORD: 01234567890123456789012345678901
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/staggers
      CLICKHOUSE_URL: http://localhost:8123
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages emit their type declarations to dist/, so build
      # before linting the apps that consume them.
      - name: Build
        run: pnpm build

      - name: Lint & typecheck
        run: pnpm lint

      - name: Test
        run: pnpm test
