---
# ExternalDNS keeps DNS records in sync with HTTPRoute hostnames generated by the
# reconciler. Requires the ExternalDNS CRDs? No — only cluster read access plus a
# DNS provider token. See https://kubernetes-sigs.github.io/external-dns/
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: platform-system
---
apiVersion: v1
kind: Secret
metadata:
  name: external-dns
  namespace: platform-system
type: Opaque
stringData:
  # Scoped Cloudflare API token with Zone:DNS:Edit for your zone.
  cloudflare_api_token: "REPLACE_WITH_CLOUDFLARE_API_TOKEN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: platform-system
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/part-of: staggers-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/part-of: staggers-platform
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: external-dns
          # Pin to a released version and review the changelog before upgrading.
          image: registry.k8s.io/external-dns/external-dns:v0.15.0
          args:
            # Derive records from the per-site HTTPRoutes the reconciler creates.
            - --source=gateway-httproute
            - --provider=cloudflare
            - --domain-filter=saas.example
            - --policy=sync
            - --registry=txt
            - --txt-owner-id=staggers-platform
            - --txt-prefix=_externaldns.
            - --log-level=info
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: external-dns
                  key: cloudflare_api_token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
