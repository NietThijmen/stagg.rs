---
# OpenTelemetry Collector configuration.
# Receives OTLP traces/logs/metrics from Envoy, sGTM, and Node services.
# Exports to ClickHouse for analytics and to console for debugging.
# Requires the OpenTelemetry Collector Contrib image (clickhouse exporter).
#
# Connection settings are injected from the deployment environment so the same
# config works with the in-cluster ClickHouse (k8s/data-stores/02-clickhouse.yaml)
# or the docker-compose ClickHouse (k8s/local/00-clickhouse-bridge.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: platform-system
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      resource:
        attributes:
          - key: saas.platform
            value: staggers
            action: upsert

    exporters:
      clickhouse:
        # Set via CLICKHOUSE_ENDPOINT (e.g. tcp://clickhouse.platform-system.svc.cluster.local:9000).
        endpoint: ${env:CLICKHOUSE_ENDPOINT}
        username: ${env:CLICKHOUSE_USERNAME}
        password: ${env:CLICKHOUSE_PASSWORD}
        database: ${env:CLICKHOUSE_DATABASE}
        traces_table_name: otel_traces
        logs_table_name: otel_logs
        metrics_table_name: otel_metrics
        ttl: 720h
        timeout: 10s
        # Default create database/tables. Disable in production after initial setup.
        create_schema: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      debug:
        verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [clickhouse, debug]
        logs:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [clickhouse, debug]
        metrics:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [debug]
      telemetry:
        logs:
          level: info
