---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-envoy
  namespace: edge-system
  labels:
    app.kubernetes.io/name: egress-envoy
    app.kubernetes.io/part-of: staggers-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: egress-envoy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress-envoy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9901"
        prometheus.io/path: "/stats/prometheus"
    spec:
      serviceAccountName: egress-envoy
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--service-cluster"
            - "egress-envoy"
            - "--service-node"
            - "egress-envoy"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 9901
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: egress-envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: egress-envoy
  namespace: edge-system
  labels:
    app.kubernetes.io/name: egress-envoy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: egress-envoy
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: admin
      port: 9901
      targetPort: admin
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-envoy
  namespace: edge-system
automountServiceAccountToken: false
---
# Egress Envoy itself is allowed to reach the internet and the OTEL collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-envoy
  namespace: edge-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: egress-envoy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: customer-workloads
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # OTEL collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    # Internet (default allow). Tighten this in production if you have static IPs.
    - {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: egress-envoy
  namespace: edge-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: egress-envoy
