---
# Local development only.
#
# Bridges the in-cluster name `clickhouse.platform-system.svc.cluster.local` to
# the ClickHouse instance published by the repo's docker-compose on the host.
# This lets the OTEL collector write to the same ClickHouse the dashboard reads
# from (CLICKHOUSE_URL=http://localhost:8123).
#
# Do NOT apply this together with k8s/data-stores/02-clickhouse.yaml: both define
# a Service named `clickhouse` in platform-system.
#
# The address below is the default gateway of the k3s node container, which the
# host's published ports are reachable on. Verify/update it with:
#   docker exec staggers-k3s ip route | awk '/^default/ {print $3}'
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: platform-system
type: Opaque
stringData:
  # Matches docker-compose.yml (CLICKHOUSE_PASSWORD).
  password: "clickhouse"
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: platform-system
spec:
  # No selector: endpoints are managed manually below.
  ports:
    - name: native
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: v1
kind: Endpoints
metadata:
  name: clickhouse
  namespace: platform-system
subsets:
  - addresses:
      - ip: 192.168.97.1
    ports:
      - name: native
        port: 9000
        protocol: TCP
      - name: http
        port: 8123
        protocol: TCP
