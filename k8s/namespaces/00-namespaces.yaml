---
apiVersion: v1
kind: Namespace
metadata:
  name: edge-system
  labels:
    app.kubernetes.io/part-of: staggers-platform
    app.kubernetes.io/component: edge
---
# Base namespace for customer workloads. The control plane creates one
# namespace per site named `<K8S_NAMESPACE>-<site-id>` (e.g.
# `customer-workloads-<uuid>`) to hold that site's sGTM and egress resources.
apiVersion: v1
kind: Namespace
metadata:
  name: customer-workloads
  labels:
    app.kubernetes.io/part-of: staggers-platform
    app.kubernetes.io/component: sgtm
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    app.kubernetes.io/part-of: staggers-platform
    app.kubernetes.io/component: control-plane
