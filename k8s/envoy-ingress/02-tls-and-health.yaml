---
# The `public-gateway-tls` secret consumed by the public gateway listener is
# provisioned by cert-manager in k8s/cert-manager/09-cert-manager.yaml.
# For a quick local test you can instead create a self-signed secret:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt -subj "/CN=*.saas.example"
#   kubectl create secret tls public-gateway-tls --cert=tls.crt --key=tls.key -n edge-system
---
# Global health-check route used by load balancer / monitoring.
# Returns 200 directly from Envoy so external probes do not hit sGTM pods.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-health
  namespace: edge-system
spec:
  parentRefs:
    - name: public-gateway
      sectionName: https-public
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /_platform/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: sgtm-platform-health
          port: 8080
  # The backend below is a tiny static responder; create it or replace with an inline direct response once supported.
